<style>
:root{--bg:#000;--fg:#fff;--mut:#8e8e93;--base:#0b0b0e;--panel:#1a1a1c;--line:#2c2c2e;--acc:#6c78ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f2f2f7;--fg:#000;--mut:#6e6e73;--base:#fff;--panel:#fff;--line:#d1d1d6}}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.top h1{font-size:20px;margin:0;font-weight:600}
.sq{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.sq svg{width:22px;height:22px}
.week{display:flex;justify-content:space-between;padding:0 8px;margin:6px 0 14px;touch-action:pan-y}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-radius:30px;color:var(--mut);font-size:15px}
.day i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.day.sel{background:var(--acc);color:#fff;font-weight:700}
.day.sel i{background:rgba(255,255,255,.22)}
.day.full i{box-shadow:inset 0 0 0 2px #34c759}
.list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.card{--c:#6c78ff;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:24px;
background:color-mix(in srgb,var(--c) 16%,var(--base));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.ic{font-size:30px;width:36px;text-align:center}
.tx{flex:1;min-width:0;text-align:left}
.tx b{display:block;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{color:var(--mut);font-size:15px}
.ring{width:52px;height:52px;border-radius:50%;border:5px solid color-mix(in srgb,var(--c) 55%,transparent);display:grid;place-items:center;flex:none;transition:background-color .15s,border-color .15s}
.ring svg{width:26px;height:26px}
.ring.done{background:var(--c);border-color:var(--c)}
.ring.run{border-color:var(--c)}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.tabs{position:fixed;left:14px;right:14px;bottom:0;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:36px;padding:6px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:28px;font-size:12px;color:var(--fg)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--acc)}.tb{display:flex;flex:1;position:relative;z-index:1}.pill{position:absolute;top:0;left:0;width:0;height:0;border-radius:28px;background:rgba(127,127,127,.2);z-index:0}
.sec{padding:0 16px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.panel h3{margin:0 0 12px;font-size:17px}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--mut)}
.bar div{width:100%;border-radius:8px;background:var(--acc);min-height:4px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .m{flex:1;min-width:0}
.srow .m b{display:block;font-weight:600}
.srow .m span{font-size:13px;color:var(--mut)}
.dots{display:flex;gap:3px;margin-top:6px}
.dots u{width:9px;height:9px;border-radius:3px;background:var(--line)}
.dots u.on{background:var(--c)}
.srow .p{font-weight:700;font-size:18px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.ov.open{display:flex}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--panel);border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=number],textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:17px}
textarea{height:130px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:22px;display:grid;place-items:center;padding:0 8px}
.chip.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 0;border-radius:11px;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--fg)}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:600;font-size:17px;background:var(--acc);color:#fff;margin-top:20px}
.btn.alt{background:var(--bg);color:var(--fg);border:1px solid var(--line);margin-top:10px}
.btn.red{background:none;color:#ff453a;margin-top:6px}
#tm{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:env(safe-area-inset-top,0px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);background:radial-gradient(120% 80% at 50% 30%,color-mix(in srgb,var(--c) 26%,var(--bg)),var(--bg) 72%);overflow:hidden}
.tmglow{position:absolute;top:50%;left:50%;width:440px;height:440px;margin:-260px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 50%,transparent),transparent 65%);opacity:.55;pointer-events:none}
.tmx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);z-index:2}
.tmx svg{width:20px;height:20px}
.tmname{font-size:22px;font-weight:700;position:relative}
.gauge{position:relative;width:min(86vw,360px);aspect-ratio:1}
.gauge svg{width:100%;height:100%;overflow:visible}
.trk{fill:none;stroke:color-mix(in srgb,var(--fg) 12%,transparent);stroke-width:16;stroke-linecap:round}
.prg{fill:none;stroke-width:16;stroke-linecap:round}
.prg.main{stroke:url(#gg)}
.prg.gl{stroke:var(--c);opacity:.7}
.tk{stroke:color-mix(in srgb,var(--fg) 22%,transparent);stroke-width:2;stroke-linecap:round;transition:stroke .3s}
.tk.on{stroke:var(--c)}
.knob{fill:#fff;filter:drop-shadow(0 0 7px var(--c))}
.knob2{fill:var(--c)}
.gc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;user-select:none}
.ge{font-size:36px;margin-bottom:2px}
.gt{font-size:62px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.05;transition:opacity .3s}
.gs{color:var(--fg);font-size:16px;font-weight:600}
.gm{color:var(--mut);font-size:13px}
#tm.paused .gt{opacity:.55}
.tmbtns{display:flex;gap:12px;position:relative;width:min(86vw,360px)}
.tb2{flex:1;padding:16px;border-radius:20px;font-weight:600;font-size:17px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--fg)}
.tb2.fin{background:var(--c);border-color:var(--c);color:#fff}
.tb2 svg{width:20px;height:20px}
.tb2:active{transform:scale(.96)}
.ico{width:36px;height:36px;object-fit:contain;border-radius:9px;display:block;margin:0 auto}
.ge .ico{width:48px;height:48px}
.icrow{display:flex;gap:8px;align-items:center}
.emprev{width:52px;height:52px;border-radius:16px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:30px;flex:none;overflow:hidden}
.emprev .ico{width:44px;height:44px}
#f-emo{flex:1;min-width:0;text-align:center;font-size:24px}
.emgrid{max-height:128px;overflow:auto;margin-top:10px}
input[type=date]{padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:17px}
.card.idea{background:linear-gradient(135deg,color-mix(in srgb,#ec4899 24%,var(--base)),color-mix(in srgb,#8b5cf6 22%,var(--base)));border-color:color-mix(in srgb,#ec4899 45%,transparent)}
.card.idea .tx b{white-space:normal;overflow:visible}
.card.idea .tag{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#f472b6;margin-bottom:2px}
.card.idea.did{opacity:.75}
.mini{width:40px;height:40px;border-radius:50%;background:rgba(127,127,127,.18);display:grid;place-items:center;font-size:20px;flex:none}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.addb{width:52px;margin:0;padding:0;font-size:26px}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
.irow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.irow:first-of-type{border-top:0}
.ichk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;flex:none;color:#fff;font-size:15px;line-height:1}
.ichk.on{background:#22c55e;border-color:#22c55e}
.itx{flex:1;min-width:0;word-break:break-word}
.itx.dn{text-decoration:line-through;color:var(--mut)}
.tdy{font-size:11px;background:#ec4899;color:#fff;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.idel{color:var(--mut);font-size:18px;width:32px;height:32px}
.seg.s3 button{font-size:13px}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;min-height:100dvh}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);--maxw:560px}
#app{max-width:var(--maxw);margin:0 auto}
.tabs{left:calc(14px + env(safe-area-inset-left,0px));right:calc(14px + env(safe-area-inset-right,0px));max-width:520px;margin-left:auto;margin-right:auto}
.wk{display:none;width:30px;flex:none;color:var(--mut);font-size:28px;line-height:1;border-radius:10px}
.gauge{width:min(86vw,360px);width:min(86vw,360px,54dvh)}
@media (hover:hover) and (pointer:fine){.wk{display:block}.wk:hover{color:var(--fg)}}
@media (hover:hover){.tab:not(.on):hover{background:rgba(127,127,127,.15)}.sq:hover,.btn:hover,.tb2:hover,.ring:not(.done):hover{filter:brightness(1.2)}.day:not(.sel):hover{background:rgba(127,127,127,.15)}.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.28);border-color:color-mix(in srgb,var(--c) 70%,transparent)}.tx:hover b{text-decoration:underline}}
@media (min-width:700px){:root{--maxw:780px}.list{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list .empty{grid-column:1/-1}.sec{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.sec .panel{margin:0}.sec .panel:only-child{grid-column:1/-1}.ov{align-items:center;justify-content:center}.sheet{max-width:480px;border-radius:28px;padding-bottom:20px}}
@media (min-width:1000px){:root{--maxw:1000px}body{padding-left:250px;padding-bottom:40px}.tabs{top:0;bottom:0;left:0;right:auto;width:250px;max-width:none;margin:0;border-radius:0;border-width:0 1px 0 0;flex-direction:column;padding:28px 14px}.tabs::before{content:'✅ Привычки';display:block;font-size:22px;font-weight:700;padding:4px 18px 24px}.tb{flex:none;flex-direction:column;gap:6px}.tab{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;font-size:16px;padding:14px 18px;border-radius:16px}.gauge{width:min(420px,56dvh)}.tmbtns{width:min(420px,86vw)}}
@media (max-height:520px) and (orientation:landscape){#tm{flex-direction:row;gap:36px}.gauge{width:min(72vh,300px)}.tmname{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:24px}.tmbtns{flex-direction:column;width:200px}.gt{font-size:48px}}
</style></head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"><div class="pill" id="pill"></div><div class="tb" id="tb"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
if(!window.gsap){var nf=function(t,a,b){var o=b||a;if(o&&o.onComplete)o.onComplete();return{}};window.gsap={to:nf,from:nf,fromTo:nf,set:function(){},killTweensOf:function(){},globalTimeline:{timeScale:function(){}}}}
try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)gsap.globalTimeline.timeScale(20)}catch(e){}
</script>
<script>
function dayWord(n){var a=n%10,b=n%100;return a===1&&b!==11?'день':(a>=2&&a<=4&&(b<12||b>14))?'дня':'дней'}
function due(h,k){var s=h.sched;if(h.created&&k<h.created)return false;if(!s||s.t==='daily')return true;var p=k.split('-'),d=new Date(+p[0],+p[1]-1,+p[2],12);
if(s.t==='week')return s.d.indexOf(d.getDay())>=0;
if(s.t==='int'){var q=(s.start||h.created||k).split('-'),b=new Date(+q[0],+q[1]-1,+q[2],12),diff=Math.round((d-b)/864e5);return diff>=0&&diff%s.n===0}
return true}
function dueList(k){return S.habits.filter(function(h){return due(h,k)||val(h,k)>0})}
function schedText(h){var s=h.sched;if(!s||s.t==='daily')return'Каждый день';
if(s.t==='week'){var d=s.d.slice().sort(function(a,b){return(a||7)-(b||7)});if(d.length===7)return'Каждый день';return d.map(function(x){return WD[x]}).join(', ')}
if(s.t==='int')return s.n===1?'Каждый день':s.n===7?'Раз в неделю':'Каждые '+s.n+' '+dayWord(s.n);return'Каждый день'}
function icoOf(h){return h.img?`<img class='ico' src='${h.img}' alt=''>`:esc(h.emoji)}
function gap(){var r={fast:[1,2],mid:[2,3],slow:[4,6]}[S.freq]||[2,3];return r[0]+Math.floor(Math.random()*(r[1]-r[0]+1))}
function pickFor(k){var id=S.pick[k];if(!id)return null;return S.ideas.find(function(i){return i.id===id})||null}
function ensurePick(){if(S.pick[TK]!==undefined)return;if(S.next&&TK<S.next)return;var pool=S.ideas.filter(function(i){return!i.done});if(!pool.length)return;var alt=pool.filter(function(i){return i.id!==S.lastId});if(alt.length)pool=alt;var it=pool[Math.floor(Math.random()*pool.length)];S.pick[TK]=it.id;S.lastId=it.id;S.next=key(addDays(today,gap()));save()}
function ideaCard(k){if(k===TK)ensurePick();var it=pickFor(k);if(!it)return'';var live=k===TK&&!it.done;
return `<div class='card idea${it.done?' did':''}' style='--c:#ec4899'><div class='ic'>✨</div><div class='tx'><span class='tag'>${k===TK?'Попробуй сегодня':'Задача дня'}</span><b>${esc(it.text)}</b></div>${live?`<button class='mini' data-idea='skip' aria-label='Другая задача'>↻</button><button class='ring' data-idea='done' aria-label='Сделал'>${IC.ok}</button>`:it.done?`<span class='ring done'>${IC.ok}</span>`:''}</div>`}
function ideasHTML(){var open=S.ideas.filter(function(i){return!i.done}).length;
var h=`<div class='top'><span style='width:44px'></span><h1>Идеи и задачи</h1><span style='width:44px'></span></div><div class='sec'>`;
h+=`<div class='panel'><h3>Новая идея</h3><div class='addrow'><input type='text' id='i-new' placeholder='Что хочется попробовать?' maxlength='140'><button class='btn addb' data-iadd='1' aria-label='Добавить'>+</button></div><div class='hint'>Приложение само будет предлагать одну из этих задач в случайный день.</div><label>Как часто предлагать</label><div class='seg s3'>${[['fast','Чаще · 1–2 дня'],['mid','2–3 дня'],['slow','Реже · 4–6']].map(function(t){return`<button class='${S.freq===t[0]?'on':''}' data-ifreq='${t[0]}'>${t[1]}</button>`}).join('')}</div>${open?`<button class='btn alt' data-inow='1'>🎲 Предложить сейчас</button>`:''}</div>`;
h+=`<div class='panel'><h3>Список · осталось ${open}</h3>`;
if(!S.ideas.length)h+=`<div class='hint' style='margin:0'>Пока пусто. Запиши первую идею выше ✨</div>`;
S.ideas.forEach(function(i){h+=`<div class='irow'><button class='ichk${i.done?' on':''}' data-itoggle='${i.id}' aria-label='Отметить'>${i.done?'✓':''}</button><span class='itx${i.done?' dn':''}'>${esc(i.text)}${S.pick[TK]===i.id&&!i.done?`<span class='tdy'>сегодня</span>`:''}</span><button class='idel' data-idelete='${i.id}' aria-label='Удалить'>✕</button></div>`});
return h+'</div></div>'}
</script>
<script>
var PAL=['#a855f7','#22a58a','#3b82f6','#f59e0b','#ec4899','#ef4444','#84cc16','#06b6d4'];
var EMO=['☀️','🛏️','🪥','💧','🧘','🏃','📚','💪','🍎','😴','💊','✍️'];
var IC={clock:`<svg viewBox='0 0 24 24' fill='none' stroke='#fff' stroke-width='2.4' stroke-linecap='round'><circle cx='12' cy='13' r='7.5'/><path d='M12 9v4l2.5 2M9.5 3h5'/></svg>`,plus:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z"/></svg>',
pause:'<svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
ok:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'};
var TABS=[['habits','Привычки','<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="4" rx="2"/><rect x="4" y="10" width="16" height="4" rx="2"/><rect x="4" y="16" width="16" height="4" rx="2"/></svg>'],
['ideas','Идеи',`<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z'/></svg>`],
['stats','Статистика','<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="11" width="4" height="9" rx="1.5"/><rect x="10" y="5" width="4" height="15" rx="1.5"/><rect x="16" y="8" width="4" height="12" rx="1.5"/></svg>'],
['settings','Настройки','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>']];
var WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function seed(){return{habits:[
{id:'a1',name:'Встать с кровати',emoji:'☀️',color:'#f59e0b',type:'check',goal:1},

if(run!==TM.run){TM.run=run;el.classList.toggle('paused',!run);el.querySelector('[data-tmpause]').innerHTML=(run?IC.pause:IC.play).replace(/#fff/g,'currentColor')+(run?'Пауза':'Продолжить');TM.sec=-1}
var sec=Math.floor(tot);
if(sec!==TM.sec){TM.sec=sec;var over=tot>=g;
el.querySelector('.gt').textContent=over?'+'+mmss(Math.floor(tot-g)):mmss(TM.rem?Math.ceil(g-tot):sec);
el.querySelector('.gs').textContent=over?'Цель выполнена ✓':!run?'пауза':TM.rem?'осталось':'потрачено';
el.querySelector('.gm').textContent=over?'всего '+mmss(sec):'из '+h.goal+' мин';
if(over&&!TM.cel){TM.cel=true;tmCelebrate()}}}
function tmCelebrate(){var g=document.querySelector('#tm .gauge');if(!g)return;var b=g.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
for(var i=0;i<18;i++){var q=document.createElement('div');q.style.cssText='position:fixed;z-index:40;pointer-events:none;border-radius:50%;width:9px;height:9px;margin:-4px;left:'+cx+'px;top:'+cy+'px;background:'+TM.h.color;document.body.appendChild(q);var an=i/18*Math.PI*2,rd=110+Math.random()*80;gsap.to(q,{x:Math.cos(an)*rd,y:Math.sin(an)*rd,opacity:0,scale:.2,duration:1,ease:'power2.out',onComplete:q.remove.bind(q)})}
gsap.fromTo(g,{scale:1},{scale:1.07,duration:.25,yoyo:true,repeat:1,ease:'power2.out'});
try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}}
function closeTimer(){var el=document.getElementById('tm');if(!el||!TM.h)return;cancelAnimationFrame(TM.raf);TM.h=null;gsap.killTweensOf('#tm .tmglow');gsap.killTweensOf('#tm .knob');
gsap.to(el,{opacity:0,scale:1.04,duration:.3,ease:'power2.in',onComplete:function(){el.style.display='none';gsap.set(el,{clearProps:'transform,opacity'})}});render()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-tmclose],[data-tmpause],[data-tmfin],[data-tmmode]');if(!t||!TM.h)return;
if(t.dataset.tmclose)closeTimer();
else if(t.dataset.tmpause){var h=TM.h,run=S.run&&S.run.id===h.id&&S.run.key===TM.key;if(run)stopRun();else{var b=val(h,TM.key);stopRun();S.run={id:h.id,key:TM.key,start:Date.now(),base:b}}save();render()}
else if(t.dataset.tmfin){stopRun();save();closeTimer()}

});

<script>

<script>
function esc2(s){return esc(s).replace(/'/g,'&#39;')}
var EMO2=['☀️','🛏️','🪥','💧','🧘','🏃','📚','💪','🍎','😴','💊','✍️','🧹','🧺','🍳','🛒','🌱','🐶','🚴','🏊','🎸','🎮','💻','📞','🧠','🙏','🥗','☕','🚿','🧼','🪴','🗑️','💰','📝','🎨','🌙','🔥','⭐','❤️','🎯'];
function grabForm(){var n=$('#f-name');if(n)form.name=n.value;var g=$('#f-goal');if(g)form.goal=Math.max(1,parseInt(g.value)||1);
if(form.sched&&form.sched.t==='int'){var iv=$('#f-int');if(iv)form.sched.n=Math.max(1,Math.min(365,parseInt(iv.value)||1));var st=$('#f-start');if(st&&st.value)form.sched.start=st.value}}
function sheet(){
var f=form;if(!f.sched)f.sched={t:'daily'};var sc=f.sched;
var prev=f.img?`<img class='ico' src='${f.img}' alt=''>`:esc(f.emoji);
var h=`<h2>${edit?'Изменить привычку':'Новая привычка'}</h2><label>Название</label><input type='text' id='f-name' value='${esc2(f.name)}' placeholder='Например, Убраться в доме'><label>Иконка или свой стикер</label><div class='icrow'><div class='emprev' id='emprev'>${prev}</div><input type='text' id='f-emo' placeholder='Свой эмодзи' value='${f.img?'':esc2(f.emoji)}' maxlength='10'><button class='chip' data-imgbtn='1' aria-label='Загрузить картинку'>🖼️</button>${f.img?`<button class='chip' data-imgclr='1' aria-label='Убрать картинку'>✕</button>`:''}</div><input type='file' id='f-file' accept='image/*' hidden><div class='row emgrid'>${EMO2.map(function(e){return`<button class='chip${!f.img&&f.emoji===e?' on':''}' data-emo='${e}'>${e}</button>`}).join('')}</div>`;
h+=`<label>Тип</label><div class='seg'>${[['check','Отметка'],['count','Счётчик'],['timer','Таймер']].map(function(t){return`<button class='${f.type===t[0]?'on':''}' data-type='${t[0]}'>${t[1]}</button>`}).join('')}</div>`;
if(f.type!=='check')h+=`<label>${f.type==='count'?'Сколько раз в день':'Сколько минут в день'}</label><input type='number' id='f-goal' min='1' max='999' value='${f.goal}' inputmode='numeric'>`;
h+=`<label>Расписание</label><div class='seg'>${[['daily','Каждый день'],['week','По дням'],['int','Каждые N дн.']].map(function(t){return`<button class='${sc.t===t[0]?'on':''}' data-sch='${t[0]}'>${t[1]}</button>`}).join('')}</div>`;
if(sc.t==='week')h+=`<div class='row' style='margin-top:10px'>${[[1,'Пн'],[2,'Вт'],[3,'Ср'],[4,'Чт'],[5,'Пт'],[6,'Сб'],[0,'Вс']].map(function(w){return`<button class='chip${sc.d.indexOf(w[0])>=0?' on':''}' data-wd='${w[0]}' style='font-size:15px'>${w[1]}</button>`}).join('')}</div>`;
if(sc.t==='int')h+=`<div class='row' style='margin-top:10px;align-items:center'><span>Каждые</span><input type='number' id='f-int' min='1' max='365' value='${sc.n}' inputmode='numeric' style='width:90px'><span>дн., начиная с</span><input type='date' id='f-start' value='${sc.start}' style='flex:1;min-width:140px'></div>`;
h+=`<label>Цвет</label><div class='row'>${PAL.map(function(c){return`<button class='sw${f.color===c?' on':''}' style='background:${c}' data-col='${c}' aria-label='цвет'></button>`}).join('')}</div><button class='btn' data-save='1'>Сохранить</button><button class='btn alt' data-close='1'>Отмена</button>`;
if(edit)h+=`<button class='btn red' data-del='1'>Удалить привычку</button>`;
$('#sheet').innerHTML=h;var ov=$('#ov');if(!ov.classList.contains('open')){ov.classList.add('open');gsap.fromTo('#ov',{backgroundColor:'rgba(0,0,0,0)'},{backgroundColor:'rgba(0,0,0,.55)',duration:.3});gsap.fromTo('#sheet',{yPercent:100},{yPercent:0,duration:.55,ease:'power4.out'});gsap.from('#sheet > *',{y:16,opacity:0,duration:.4,stagger:.035,delay:.1,ease:'power2.out'})}
gsap.from('.chip.on,.sw.on,.seg button.on',{scale:.85,duration:.35,ease:'back.out(3)'})}
function burstAt(el,col){var b=el.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;for(var i=0;i<12;i++){var q=document.createElement('div');q.style.cssText='position:fixed;z-index:40;pointer-events:none;border-radius:50%;width:8px;height:8px;margin:-4px;left:'+cx+'px;top:'+cy+'px;background:'+col;document.body.appendChild(q);var an=i/12*Math.PI*2,rd=40+Math.random()*30;gsap.to(q,{x:Math.cos(an)*rd,y:Math.sin(an)*rd,opacity:0,scale:.3,duration:.7,ease:'power2.out',onComplete:q.remove.bind(q)})}}
document.addEventListener('click',function(e){var t=e.target.closest('[data-sch],[data-wd],[data-imgbtn],[data-imgclr],[data-iadd],[data-itoggle],[data-idelete],[data-ifreq],[data-inow],[data-idea]');if(!t)return;var d=t.dataset;
if(d.sch!==undefined){if(form.sched&&form.sched.t===d.sch)return;grabForm();var dow=today.getDay();form.sched=d.sch==='week'?{t:'week',d:[dow]}:d.sch==='int'?{t:'int',n:2,start:key(today)}:{t:'daily'};sheet()}
else if(d.wd!==undefined){grabForm();var ix=form.sched.d.indexOf(+d.wd);if(ix>=0)form.sched.d.splice(ix,1);else form.sched.d.push(+d.wd);sheet()}
else if(d.imgbtn!==undefined){var fi=$('#f-file');if(fi)fi.click()}
else if(d.imgclr!==undefined){grabForm();form.img=null;sheet()}
else if(d.iadd!==undefined){var inp=$('#i-new'),v=inp.value.trim();if(!v){inp.focus();return}S.ideas.unshift({id:'i'+Date.now().toString(36),text:v,done:false});save();render();var nn=$('#i-new');if(nn)nn.focus()}
else if(d.itoggle){var a=S.ideas.find(function(i){return i.id===d.itoggle});if(a){a.done=!a.done;save();render()}}
else if(d.idelete){S.ideas=S.ideas.filter(function(i){return i.id!==d.idelete});Object.keys(S.pick).forEach(function(k){if(S.pick[k]===d.idelete)delete S.pick[k]});save();render()}
else if(d.ifreq){S.freq=d.ifreq;save();render()}
else if(d.inow!==undefined){var cur=pickFor(TK),pool=S.ideas.filter(function(i){return!i.done&&(!cur||i.id!==cur.id)});if(!pool.length&&!(cur&&!cur.done)){alert('Нет невыполненных идей');return}if(pool.length){var pk=pool[Math.floor(Math.random()*pool.length)];S.pick[TK]=pk.id;S.lastId=pk.id}S.next=key(addDays(today,gap()));save();sel=TK;if(view==='habits')render('cards');else go('habits')}
else if(d.idea==='done'){var it=pickFor(TK);if(!it)return;burstAt(t,'#ec4899');it.done=true;save();setTimeout(function(){render('cards')},380)}
else if(d.idea==='skip'){var c2=pickFor(TK),pl=S.ideas.filter(function(i){return!i.done&&(!c2||i.id!==c2.id)});if(!pl.length){alert('Других невыполненных задач нет. Добавь новые во вкладке «Идеи».');return}var np=pl[Math.floor(Math.random()*pl.length)];S.pick[TK]=np.id;S.lastId=np.id;save();render();gsap.from('.card.idea',{y:-20,opacity:0,scale:.9,duration:.5,ease:'back.out(2)'})}
});
document.addEventListener('input',function(e){if(e.target.id!=='f-emo'||!form)return;var v=e.target.value.trim(),arr=(window.Intl&&Intl.Segmenter)?Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(v),function(s){return s.segment}):Array.from(v);form.emoji=arr[0]||'⭐';form.img=null;var pv=$('#emprev');if(pv)pv.textContent=form.emoji});
document.addEventListener('change',function(e){if(e.target.id!=='f-file')return;var fl=e.target.files&&e.target.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){try{var c=document.createElement('canvas'),s=128;c.width=c.height=s;var cx=c.getContext('2d'),k=s/Math.max(im.width,im.height),w=im.width*k,hh=im.height*k;cx.drawImage(im,(s-w)/2,(s-hh)/2,w,hh);grabForm();form.img=c.toDataURL('image/png');sheet()}catch(er){alert('Не удалось загрузить картинку')}};im.onerror=function(){alert('Не удалось открыть картинку')};im.src=rd.result};rd.readAsDataURL(fl)});
document.addEventListener('keydown',function(e){if(e.target&&e.target.id==='i-new'&&e.key==='Enter'){e.preventDefault();var b=document.querySelector('[data-iadd]');if(b)b.click()}});
</script>
