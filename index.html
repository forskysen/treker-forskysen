body{background:transparent}

<script>
function dayWord(n){var a=n%10,b=n%100;return a===1&&b!==11?'день':(a>=2&&a<=4&&(b<12||b>14))?'дня':'дней'}
function due(h,k){var s=h.sched;if(h.created&&k<h.created)return false;if(!s||s.t==='daily')return true;var p=k.split('-'),d=new Date(+p[0],+p[1]-1,+p[2],12);
if(s.t==='week')return s.d.indexOf(d.getDay())>=0;
if(s.t==='int'){var q=(s.start||h.created||k).split('-'),b=new Date(+q[0],+q[1]-1,+q[2],12),diff=Math.round((d-b)/864e5);return diff>=0&&diff%s.n===0}
return true}
function dueList(k){return S.habits.filter(function(h){return due(h,k)||val(h,k)>0})}
function animOff(){try{return localStorage.getItem('anim_off')==='1'}catch(e){return false}}
function uid(){try{if(crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=b[6]&15|64;b[8]=b[8]&63|128;var h=[].map.call(b,function(x){return('0'+x.toString(16)).slice(-2)}).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)}
function progHTML(){var dl=dueList(sel);if(!dl.length)return'';var n=dl.filter(function(x){return isDone(x,sel)}).length,p=Math.round(n/dl.length*100);
return `<div class='prog'><div class='pt'><b>${n} из ${dl.length}</b><span>${n===dl.length?'всё сделано 🎉':'выполнено'}</span><em>${p}%</em></div><div class='pbar'><i style='width:${p}%'></i></div></div>`}
function schedText(h){var s=h.sched;if(!s||s.t==='daily')return'Каждый день';
if(s.t==='week'){var d=s.d.slice().sort(function(a,b){return(a||7)-(b||7)});if(d.length===7)return'Каждый день';return d.map(function(x){return WD[x]}).join(', ')}
if(s.t==='int')return s.n===1?'Каждый день':s.n===7?'Раз в неделю':'Каждые '+s.n+' '+dayWord(s.n);return'Каждый день'}
function icoOf(h){return h.img?`<img class='ico' src='${h.img}' alt=''>`:esc(h.emoji)}
function gap(){var r={fast:[1,2],mid:[2,3],slow:[4,6]}[S.freq]||[2,3];return r[0]+Math.floor(Math.random()*(r[1]-r[0]+1))}
function pickFor(k){var id=S.pick[k];if(!id)return null;return S.ideas.find(function(i){return i.id===id})||null}
function ensurePick(){if(S.pick[TK]!==undefined)return;if(S.next&&TK<S.next)return;var pool=S.ideas.filter(function(i){return!i.done});if(!pool.length)return;var alt=pool.filter(function(i){return i.id!==S.lastId});if(alt.length)pool=alt;var it=pool[Math.floor(Math.random()*pool.length)];S.pick[TK]=it.id;S.lastId=it.id;S.next=key(addDays(today,gap()));save()}

h+=`<div class='panel'><h3>Список · осталось ${open}</h3>`;
if(!S.ideas.length)h+=`<div class='hint' style='margin:0'>Пока пусто. Запиши первую идею выше ✨</div>`;
S.ideas.forEach(function(i){h+=`<div class='irow'><button class='ichk${i.done?' on':''}' data-itoggle='${i.id}' aria-label='Отметить'>${i.done?'✓':''}</button><span class='itx${i.done?' dn':''}'>${esc(i.text)}${S.pick[TK]===i.id&&!i.done?`<span class='tdy'>сегодня</span>`:''}</span><button class='idel' data-idelete='${i.id}' aria-label='Удалить'>✕</button></div>`});

<script>

['ideas','Идеи',`<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z'/></svg>`],
['stats','Статистика','<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="11" width="4" height="9" rx="1.5"/><rect x="10" y="5" width="4" height="15" rx="1.5"/><rect x="16" y="8" width="4" height="12" rx="1.5"/></svg>'],
['settings','Настройки','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>']];
var WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function seed(){return{habits:[
{id:'a1',name:'Встать с кровати',emoji:'☀️',color:'#f59e0b',type:'check',goal:1},
{id:'a2',name:'Заправить кровать',emoji:'🛏️',color:'#a855f7',type:'check',goal:1},
{id:'a3',name:'Умыться',emoji:'💧',color:'#22a58a',type:'check',goal:1},
{id:'a4',name:'Почистить зубы',emoji:'🪥',color:'#22a58a',type:'count',goal:2},
{id:'a5',name:'Растяжка',emoji:'🧘',color:'#22a58a',type:'timer',goal:5}],log:{},run:null}}
var S;try{S=JSON.parse(localStorage.getItem('habits_v1'))}catch(e){}
if(!S||!S.habits)S=seed();S.ideas=S.ideas||[];S.pick=S.pick||{};S.freq=S.freq||'mid';S.next=S.next||'';
function save(){try{localStorage.setItem('habits_v1',JSON.stringify(S))}catch(e){}}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
var today=new Date();today.setHours(12,0,0,0);
var TK=key(today),sel=TK,off=0,view='habits',edit=null,form=null;
function elapsed(){return S.run?Math.floor((Date.now()-S.run.start)/1000):0}
function val(h,k){if(S.run&&S.run.id===h.id&&S.run.key===k)return S.run.base+elapsed();return(S.log[k]&&S.log[k][h.id])||0}
function goal(h){return h.type==='timer'?h.goal*60:h.type==='count'?h.goal:1}
function isDone(h,k){return val(h,k)>=goal(h)}
function setVal(h,k,v){(S.log[k]=S.log[k]||{})[h.id]=v}
function stopRun(){if(!S.run)return;var h=S.habits.find(function(x){return x.id===S.run.id});if(h)setVal(h,S.run.key,S.run.base+elapsed());S.run=null}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function sub(h,k){var v=val(h,k);
if(h.type==='count')return schedText(h)+', '+v+'/'+h.goal;
if(h.type==='timer'){var run=S.run&&S.run.id===h.id&&S.run.key===k;return schedText(h)+', '+(run?mmss(v)+' / ':Math.floor(v/60)+'/')+h.goal+' мин'}
return schedText(h)}
function title(){if(sel===TK)return'Сегодня';var p=sel.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+' · '+WD[d.getDay()]}
function render(anim,dir){
var h='';
if(view==='habits'){
h+='<div class="top"><span style="width:44px"></span><h1>'+title()+'</h1><button class="sq" data-new="1" aria-label="Добавить">'+IC.plus.replace(/#fff/g,'currentColor')+'</button></div>';
h+='<div class="week" id="week"><button class="wk" data-wk="-1" aria-label="Назад">‹</button>';
for(var i=-5;i<=1;i++){var d=addDays(today,i+off*7),k=key(d);
var dl=dueList(k),all=dl.length&&dl.every(function(x){return isDone(x,k)});
h+='<button class="day'+(k===sel?' sel':'')+(all?' full':'')+'" data-day="'+k+'"><span>'+WD[d.getDay()]+'</span><i>'+d.getDate()+'</i></button>'}
h+='<button class="wk" data-wk="1" aria-label="Вперёд">›</button></div>'+progHTML()+'<div class="list">';
if(!S.habits.length)h+='<div class="empty">Привычек пока нет.<br>Нажми «+», чтобы создать первую.</div>';else if(!dueList(sel).length&&!pickFor(sel))h+='<div class="empty">На этот день ничего не запланировано 🌿</div>';h+=ideaCard(sel);
dueList(sel).forEach(function(x){
var dn=isDone(x,sel),run=S.run&&S.run.id===x.id&&S.run.key===sel;
var icon=dn?IC.ok:x.type==='timer'?(run?IC.clock:IC.play):IC.plus;
h+='<div class="card" style="--c:'+x.color+'"><div class="ic">'+icoOf(x)+'</div><button class="tx" data-edit="'+x.id+'"><b>'+esc(x.name)+'</b><span data-sub="'+x.id+'">'+sub(x,sel)+'</span></button><button class="ring'+(dn?' done':'')+(run?' run':'')+'" data-act="'+x.id+'" aria-label="Отметить">'+icon+'</button></div>'});
h+='</div>'}
else if(view==='stats')h=statsHTML();else if(view==='ideas')h=ideasHTML();
else h=settingsHTML();
gsap.killTweensOf('.ring');$('#app').innerHTML=h;
$('#tb').innerHTML=TABS.map(function(t){return'<button class="tab'+(view===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>'}).join('');
var w=$('#week');if(w)swipe(w);afterRender(anim,dir)}
function $(s){return document.querySelector(s)}
var busy=false,first=true,pressed=null;
function movePill(now){var on=document.querySelector('.tab.on'),nav=$('#tabs');if(!on||!nav)return;var a=on.getBoundingClientRect(),b=nav.getBoundingClientRect();gsap.to('#pill',{x:a.left-b.left-nav.clientLeft,y:a.top-b.top-nav.clientTop,width:a.width,height:a.height,duration:now?0:.5,ease:'power3.out'})}
function afterRender(anim,dir){
movePill(first);first=false;
if(view==='habits'){
if(anim==='all')gsap.from('.top h1',{opacity:0,y:-8,duration:.4});
if(anim==='all'||anim==='week')gsap.from('.day',{x:(dir||0)*40,y:dir?0:-14,opacity:0,duration:.45,stagger:.04,ease:'power3.out'});
if(anim==='all'||anim==='cards')gsap.from('.prog',{y:14,opacity:0,duration:.5});
var pb=document.querySelector('.pbar i');if(pb){var cw=pb.style.width;gsap.fromTo(pb,{width:window.lastP||'0%'},{width:cw,duration:.8,ease:'power3.out'});window.lastP=cw}
if(anim==='all'||anim==='cards')gsap.from('.card',{y:26,opacity:0,scale:.96,duration:.5,stagger:.07,ease:'power3.out'});
if(anim==='cards')gsap.from('.day.sel',{scale:.85,duration:.45,ease:'back.out(3)'});
if(document.querySelector('.ring.run'))gsap.to('.ring.run',{scale:1.1,duration:.7,yoyo:true,repeat:-1,ease:'sine.inOut'});
}else if(anim==='all'){
gsap.from('.panel',{y:24,opacity:0,duration:.5,stagger:.1,ease:'power3.out'});
if(view==='stats'){gsap.from('.bar div',{height:0,duration:.9,stagger:.06,delay:.15,ease:'power3.out'});gsap.from('.srow',{x:-16,opacity:0,duration:.4,stagger:.05,delay:.2});gsap.from('.dots u',{scale:0,duration:.3,stagger:.004,delay:.3})}
}}
function go(v){if(v===view||busy)return;busy=true;var o=['habits','ideas','stats','settings'],dx=o.indexOf(v)>o.indexOf(view)?30:-30;view=v;
document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab===v)});movePill();
gsap.to('#app',{opacity:0,x:-dx,duration:.18,ease:'power2.in',onComplete:function(){render('all');window.scrollTo(0,0);gsap.fromTo('#app',{opacity:0,x:dx},{opacity:1,x:0,duration:.35,ease:'power3.out',onComplete:function(){busy=false}})}})}
function closeSheet(){gsap.to('#sheet',{yPercent:100,duration:.35,ease:'power3.in'});gsap.to('#ov',{backgroundColor:'rgba(0,0,0,0)',duration:.35,onComplete:function(){$('#ov').classList.remove('open');gsap.set('#ov',{clearProps:'backgroundColor'});gsap.set('#sheet',{clearProps:'transform'})}})}
function popRing(id,burst){var r=document.querySelector('[data-act='+id+']');if(!r)return;
if(burst){var b=r.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,col=getComputedStyle(r.closest('.card')).getPropertyValue('--c')||'#fff';
for(var i=0;i<10;i++){var p=document.createElement('div');p.style.cssText='position:fixed;left:'+cx+'px;top:'+cy+'px;width:8px;height:8px;margin:-4px;border-radius:50%;pointer-events:none;z-index:30;background:'+col;document.body.appendChild(p);var an=i/10*Math.PI*2,rd=40+Math.random()*30;gsap.to(p,{x:Math.cos(an)*rd,y:Math.sin(an)*rd,opacity:0,scale:.3,duration:.7,ease:'power2.out',onComplete:p.remove.bind(p)})}}
if(r.classList.contains('run'))return;
gsap.fromTo(r,{scale:.7},{scale:1,duration:.6,ease:'elastic.out(1,.45)'});
var s=r.querySelector('svg');if(s&&r.classList.contains('done'))gsap.from(s,{scale:0,rotation:-60,duration:.45,ease:'back.out(3)'})}
function swipe(el){var x0=null;el.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
el.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){var dr=dx>0?-1:1;off+=dr;render('week',dr)}})}
function streak(h){var d=new Date(today),n=0,i=0;while(i<800){var k=key(d);if(due(h,k)||val(h,k)>0){if(isDone(h,k))n++;else if(i>0)break}d=addDays(d,-1);i++}return n}
function statsHTML(){
var h='<div class="top"><span style="width:44px"></span><h1>Статистика</h1><span style="width:44px"></span></div><div class="sec">';
h+='<div class="panel"><h3>Выполнено за 7 дней</h3><div class="bars">';
for(var i=-6;i<=0;i++){var d=addDays(today,i),k=key(d),dl=dueList(k),n=dl.filter(function(x){return isDone(x,k)}).length,p=dl.length?Math.round(n/dl.length*100):0;
h+='<div class="bar"><span>'+p+'%</span><div style="height:'+Math.max(p*0.8,4)+'px"></div><span>'+WD[d.getDay()]+'</span></div>'}
h+='</div></div><div class="panel"><h3>По привычкам</h3>';

S.habits.forEach(function(x){

var tt=0;for(var j=-29;j<=0;j++){var kj=key(addDays(today,j));if(due(x,kj)){tt++;if(isDone(x,kj))c++}}
h+='<div class="srow" style="--c:'+x.color+'"><div class="ic" style="font-size:26px">'+icoOf(x)+'</div><div class="m"><b>'+esc(x.name)+'</b><span>🔥 серия: '+streak(x)+' дн.</span><div class="dots">'+dots+'</div></div><div class="p">'+(tt?Math.round(c/tt*100):0)+'%<div style="font-size:11px;color:var(--mut);font-weight:400">30 дней</div></div></div>'});
return h+'</div></div>'}
function settingsHTML(){
return'<div class="top"><span style="width:44px"></span><h1>Настройки</h1><span style="width:44px"></span></div><div class="sec">'+(typeof accountHTML==='function'?accountHTML():'')+'<div class="panel"><h3>Анимации</h3><div class="seg"><button class="'+(animOff()?'':'on')+'" data-anim="on">Включены</button><button class="'+(animOff()?'on':'')+'" data-anim="off">Выключены</button></div></div><div class="panel"><h3>Перенос данных</h3><div style="color:var(--mut);font-size:14px;margin-bottom:10px">Данные хранятся только в этом браузере. Скопируй текст ниже, чтобы сохранить копию, или вставь свой и нажми «Загрузить».</div><textarea id="bk">'+esc(JSON.stringify({habits:S.habits,log:S.log,ideas:S.ideas,pick:S.pick,freq:S.freq,next:S.next}))+'</textarea><button class="btn" data-imp="1">Загрузить из текста</button><button class="btn alt" data-reset="1">Сбросить всё</button></div></div>'}
function openSheet(id){
edit=id;var h=id?S.habits.find(function(x){return x.id===id}):null;
form=h?JSON.parse(JSON.stringify(h)):{name:'',emoji:'⭐',color:PAL[1],type:'check',goal:1,sched:{t:'daily'},created:key(today)};
sheet()}
function sheet(){
var f=form;
var h='<h2>'+(edit?'Изменить привычку':'Новая привычка')+'</h2><label>Название</label><input type="text" id="f-name" value="'+esc(f.name)+'" placeholder="Например, Пить воду"><label>Иконка</label><div class="row">'+EMO.map(function(e){return'<button class="chip'+(f.emoji===e?' on':'')+'" data-emo="'+e+'">'+e+'</button>'}).join('')+'</div><label>Тип</label><div class="seg">'+[['check','Отметка'],['count','Счётчик'],['timer','Таймер']].map(function(t){return'<button class="'+(f.type===t[0]?'on':'')+'" data-type="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
if(f.type!=='check')h+='<label>'+(f.type==='count'?'Сколько раз в день':'Сколько минут в день')+'</label><input type="number" id="f-goal" min="1" max="999" value="'+f.goal+'" inputmode="numeric">';
h+='<label>Цвет</label><div class="row">'+PAL.map(function(c){return'<button class="sw'+(f.color===c?' on':'')+'" style="background:'+c+'" data-col="'+c+'" aria-label="цвет"></button>'}).join('')+'</div><button class="btn" data-save="1">Сохранить</button><button class="btn alt" data-close="1">Отмена</button>';

gsap.from('.chip.on,.sw.on,.seg button.on',{scale:.85,duration:.35,ease:'back.out(3)'})}

document.addEventListener('click',function(e){

else if(d.reset!==undefined){if(confirm('Удалить все привычки и историю?')){S=seed();S.habits=[];S.ideas=[];S.pick={};S.freq='mid';S.next='';save();render()}}

Object.keys(S.log).forEach(function(d){var o=S.log[d],n={};Object.keys(o).forEach(function(k){n[map[k]||k]=o[k]});S.log[d]=n});

/* ---------- local state -> DB rows ---------- */
function habitRows(){return S.habits.map(function(h,i){return habitRow(h,i)})}
function habitRow(h,i){
var img=(typeof h.img==='string'&&/^data:image\//.test(h.img)&&h.img.length<=70000)?h.img:null;
return{id:h.id,name:String(h.name||'').trim().slice(0,80)||'\u041f\u0440\u0438\u0432\u044b\u0447\u043a\u0430',emoji:Array.from(h.emoji||'\u2b50').slice(0,8).join(''),img:img,
color:/^#[0-9a-fA-F]{6}$/.test(h.color||'')?h.color:'#22a58a',type:['check','count','timer'].indexOf(h.type)>=0?h.type:'check',
goal:Math.min(999,Math.max(1,(h.goal|0)||1)),sched:h.sched||{t:'daily'},created_on:DATE.test(h.created||'')?h.created:'2000-01-01',position:i}}
function ideaRows(){var out=[];S.ideas.forEach(function(i){var t=String(i.text||'').trim().slice(0,140);if(t)out.push({id:i.id,text:t,done:!!i.done,done_at:i.done?new Date().toISOString():null})});return out}
function logRows(){var ids={};S.habits.forEach(function(h){ids[h.id]=1});var out=[];
Object.keys(S.log).forEach(function(d){if(!DATE.test(d))return;var o=S.log[d];Object.keys(o).forEach(function(k){var v=Math.round(o[k]);if(ids[k]&&v>0)out.push({habit_id:k,day:d,value:Math.min(86400,v)})})});return out}
function stateRow(){var ids={};S.ideas.forEach(function(i){ids[i.id]=1});var p={};Object.keys(S.pick).forEach(function(d){if(ids[S.pick[d]])p[d]=S.pick[d]});
return{freq:['fast','mid','slow'].indexOf(S.freq)>=0?S.freq:'mid',next_pick:DATE.test(S.next||'')?S.next:null,last_idea_id:(S.lastId&&ids[S.lastId])?S.lastId:null,picks:p}}

var api={
count:async function(t){var r=await cloud.cl.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;return r.count||0},
all:async function(t,order){var out=[],from=0,step=1000;for(;;){var q=cloud.cl.from(t).select('*');(order||[]).forEach(function(o){q=q.order(o[0],{ascending:o[1]!==false})});var r=await q.range(from,from+step-1);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<step)break;from+=step}return out},
upsert:async function(t,rows,conflict){for(var i=0;i<rows.length;i+=500){var r=await cloud.cl.from(t).upsert(rows.slice(i,i+500),{onConflict:conflict});if(r.error)throw r.error}}
};

async function uploadLocal(force){

await api.upsert('habits',habitRows(),'id');
await api.upsert('ideas',ideaRows(),'id');
await api.upsert('habit_logs',logRows(),'habit_id,day');

async function downloadCloud(){
var hs=await api.all('habits',[['position'],['created_at']]);
var is=await api.all('ideas',[['created_at',false]]);
var lg=await api.all('habit_logs',[['day'],['habit_id']]);
var st=(await api.all('user_state',[['user_id']]))[0];
S.habits=hs.map(function(r){var h={id:r.id,name:r.name,emoji:r.emoji,color:r.color,type:r.type,goal:r.goal,sched:r.sched,created:r.created_on};if(r.img)h.img=r.img;return h});
S.ideas=is.map(function(r){return{id:r.id,text:r.text,done:!!r.done}});
S.log={};lg.forEach(function(r){(S.log[r.day]=S.log[r.day]||{})[r.habit_id]=r.value});
S.pick=(st&&st.picks)||{};S.freq=(st&&st.freq)||'mid';S.next=(st&&st.next_pick)||'';S.lastId=(st&&st.last_idea_id)||undefined;
S.run=null;save()}

/* ---------- merge with de-duplication ---------- */
function nkey(t){return String(t||'').trim().toLowerCase().replace(/\s+/g,' ')}
async function mergeLocal(){
reid(false);save();
var ch=await api.all('habits',[['position'],['created_at']]),ci=await api.all('ideas',[['created_at',false]]),cl=await api.all('habit_logs',[['day'],['habit_id']]);
var hk={},ik={},clog={};
ch.forEach(function(r){var k=nkey(r.name)+'|'+r.type;if(!hk[k])hk[k]=r.id});
ci.forEach(function(r){var k=nkey(r.text);if(!ik[k])ik[k]={id:r.id,done:!!r.done,text:r.text}});
cl.forEach(function(r){clog[r.habit_id+'|'+r.day]=r.value});
var hmap={},newH=[],pos=ch.length,skipH=0;
S.habits.forEach(function(h){var k=nkey(h.name)+'|'+h.type;
if(hk[k]){hmap[h.id]=hk[k];skipH++}
else{var nid=uid();hmap[h.id]=nid;hk[k]=nid;newH.push(habitRow(Object.assign({},h,{id:nid}),pos++))}});
var newI=[],updI=[],skipI=0;
S.ideas.forEach(function(i){var t=String(i.text||'').trim().slice(0,140);if(!t)return;var k=nkey(t),ex=ik[k];
if(ex){skipI++;if(i.done&&!ex.done){ex.done=true;updI.push({id:ex.id,text:ex.text,done:true,done_at:new Date().toISOString()})}}
else{var nid=uid();ik[k]={id:nid,done:!!i.done,text:t};newI.push({id:nid,text:t,done:!!i.done,done_at:i.done?new Date().toISOString():null})}});
var out={};
Object.keys(S.log).forEach(function(d){if(!DATE.test(d))return;Object.keys(S.log[d]).forEach(function(k){
var hid=hmap[k],v=Math.min(86400,Math.round(S.log[d][k]));if(!hid||!(v>0))return;
var key=hid+'|'+d,cv=clog[key];if(cv===undefined||v>cv){clog[key]=v;out[key]={habit_id:hid,day:d,value:v}}})});
await api.upsert('habits',newH,'id');
await api.upsert('ideas',newI.concat(updI),'id');
await api.upsert('habit_logs',Object.keys(out).map(function(k){return out[k]}),'habit_id,day');
return{habits:newH.length,skippedHabits:skipH,ideas:newI.length,skippedIdeas:skipI}}
function reloadS(){try{var r=JSON.parse(ls('habits_v1'));if(!r||!r.habits)return;S.habits=r.habits;S.log=r.log||{};S.ideas=r.ideas||[];S.pick=r.pick||{};S.freq=r.freq||'mid';S.next=r.next||'';S.lastId=r.lastId;S.run=r.run||null}catch(e){}}
function withLock(fn){if(typeof navigator!=='undefined'&&navigator.locks&&navigator.locks.request)return navigator.locks.request('habits-first-sync',fn);return fn()}

function afterData(){if(view==='habits')render('cards');else render()}
async function firstSync(){
if(cloud.busy||!cloud.session)return;cloud.busy=true;cloudChanged();
try{await withLock(async function(){
reloadS();
var l=getLink();
if(l&&l.uid===cloud.session.user.id){await refreshStat();afterData();return}
hooks.toast('Проверяем облако…');
var cc={habits:await api.count('habits'),ideas:await api.count('ideas'),logs:await api.count('habit_logs')};
var empty=!cc.habits&&!cc.ideas&&!cc.logs,lc=localSummary(),pristine=isPristine();
if(empty){await uploadLocal(false);setLink();hooks.toast('Данные загружены в облако ✓')}
else if(pristine){await downloadCloud();setLink();hooks.toast('Данные загружены из облака ✓')}
else{var ch=await hooks.ask(cc,lc);
if(ch==='merge'){backup();var rep=await mergeLocal();await downloadCloud();setLink();hooks.toast('Объединено ✓ Добавлено привычек: '+rep.habits+', одинаковых пропущено: '+rep.skippedHabits)}

else{await cloud.cl.auth.signOut({scope:'local'});hooks.toast('Вы вышли из аккаунта, данные не изменены')}}
await refreshStat();afterData()})
}catch(e){hooks.toast('Ошибка синхронизации: '+(e&&e.message||e),true)}
